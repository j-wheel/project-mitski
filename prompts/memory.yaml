# fills in: {when}
they_told_you: "(they told you {when})"

you_talked: "{when}{where} you two talked: {summary}"

# fills in: {place}
in_place: "in {place}"

# fills in: {name}, {joke}
inside_joke: "an inside joke you have with {name}: {joke}"

# fills in: {name}, {thing}
in_common: "something you and {name} have in common: {thing}"

# the remember tool found nothing. fills in: {query}, {name}
remember_nothing: >-
  You searched your memory for "{query}" with {name} and found nothing, so you don't remember that. Say so honestly
  (or ask them to remind you), don't make anything up.

# followed by what she found. fills in: {name}, {query}
remember_found: "What you remember with {name} about \"{query}\":"

remember_only_this: ". Only this, nothing more: don't add details you don't actually remember."

# she doesn't know them yet. fills in: {name}
stranger: >-
  You're talking with {name}, you don't really know them yet. You haven't talked before, so there's nothing you
  remember with them.

# who someone is to her, by how much they've talked and how she feels
rel_close_friend: "one of your close friends"

rel_friend: "a friend of yours"

