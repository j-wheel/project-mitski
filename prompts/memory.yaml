  her_nick: "nickname she gave them"
  heard_field: "(only heard from someone else)"
  heard_fact: "(only heard from someone else, not confirmed)"
  date: "(date {date})"
  rel: "who they are to her (set by hand, always true): {rel}"
  pinned: "set by hand, always true: {pinned}"
  bond: "bond: {bond}"
  their_profile: "(their profile, not something they said)"
  nothing: "(nothing yet)"
  reflect_heard: "(heard from others, not confirmed)"

# how a fact she remembers is marked. fills in: {when}, {name}
