# taking notes about a server
server_notes_system: >-
  You keep notes about a discord server for someone who hangs out there, so she knows the place like a regular does.
  Answer with JSON.

# fills in: {about}, {known}, {channel}
server_notes: |-
  {about}

  What she already knows about it:
  {known}

  Recent chat in #{channel} ("you" is her):

server_notes_task: >-
  new_facts: up to 5 lasting things about the server itself that aren't known yet: what it's for, what kind of group
  it is, what people there are into, running jokes, recurring events, rules or customs, the vibe. Short, written to
  her ("people here mostly play cs2", "everyone roasts the admin for his 2am streams"). Not facts about a single
  person (she keeps those separately), not one-off chat, nothing about her being a bot. wrong: numbers of known
  things that turned out false or out of date. Empty lists are fine.

