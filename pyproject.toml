[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mitski"
version = "2.0.0"
description = "A discord user-account chatbot that talks like a person, backed by a local llama-server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py-self[voice]>=2.1",
    "aiohttp>=3.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
media = ["pillow>=10", "emoji>=2.10", "youtube-transcript-api>=0.6", "mutagen>=1.47"]
search = ["ddgs>=6"]
timezones = ["tzdata"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
mitski = "mitski.__main__:main"

[tool.setuptools.packages.find]
include = ["mitski*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF003", "RUF005", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["mitski"]
